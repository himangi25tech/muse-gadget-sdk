<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect width="960" height="460" fill="#f7f4ee"/>
  <text x="40" y="40" font-family="Georgia, serif" font-size="22" fill="#1c1917">Muse explains. The Pi recommends. The charger decides.</text>
  <rect x="40" y="70" width="180" height="78" rx="8" fill="#fff" stroke="#1c1917"/>
  <text x="130" y="100" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Person</text>
  <text x="130" y="122" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">"Why so slow?"</text>
  <rect x="280" y="70" width="200" height="78" rx="8" fill="#fff" stroke="#1c1917"/>
  <text x="380" y="100" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Muse gadget</text>
  <text x="380" y="122" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">asks, then reads the answer</text>
  <rect x="540" y="70" width="380" height="78" rx="8" fill="#fff" stroke="#1c1917"/>
  <text x="730" y="100" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Linux gadget</text>
  <text x="730" y="122" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">energy.recommend</text>
  <path d="M220 109 H280" stroke="#1c1917" marker-end="url(#a)"/>
  <path d="M480 109 H540" stroke="#1c1917" marker-end="url(#a)"/>
  <rect x="40" y="200" width="280" height="90" rx="8" fill="#fff" stroke="#1c1917"/>
  <text x="180" y="234" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">~/muse/energy.json</text>
  <text x="180" y="258" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">cap, building, solar, cars</text>
  <path d="M320 245 H730 V148" stroke="#1c1917" fill="none" marker-end="url(#a)"/>
  <rect x="540" y="210" width="380" height="90" rx="8" fill="#fff7ed" stroke="#9a3412"/>
  <text x="730" y="244" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#9a3412">Recommendation</text>
  <text x="730" y="268" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#9a3412">charge-now peak vs spread peak</text>
  <path d="M730 148 V210" stroke="#9a3412" marker-end="url(#b)"/>
  <rect x="540" y="350" width="380" height="78" rx="8" fill="#fff" stroke="#1c1917"/>
  <text x="730" y="380" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Charger / car</text>
  <text x="730" y="402" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">not connected by this command</text>
  <path d="M730 300 V350" stroke="#1c1917" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="40" y="392" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">Dashed line is not in this command.</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1c1917"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#9a3412"/></marker>
  </defs>
</svg>
