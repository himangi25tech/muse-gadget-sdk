<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#f7f4ee"/>
  <text x="40" y="40" font-family="Georgia, serif" font-size="22" fill="#1c1917">Same energy. Lower peak.</text>
  <text x="40" y="66" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#57534e">The cars still take the kilowatt-hours they need. They do not all take them at once.</text>
  <text x="70" y="110" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1c1917">Charge now</text>
  <rect x="180" y="96" width="520" height="22" fill="#9a3412"/>
  <text x="710" y="112" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#9a3412">over the cap</text>
  <text x="70" y="160" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#1c1917">Spread</text>
  <rect x="180" y="146" width="300" height="22" fill="#166534"/>
  <text x="490" y="162" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#166534">under the cap</text>
  <line x1="180" y1="80" x2="180" y2="190" stroke="#a8a29e"/>
  <text x="40" y="230" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">What the society keeps</text>
  <text x="40" y="258" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#57534e">Every car that can finish still finishes by the departure in the file.</text>
  <text x="40" y="282" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#57534e">The building stays closer to its sanctioned load instead of a short evening spike.</text>
  <text x="40" y="306" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#57534e">If solar_kw is above zero, that generation is used before grid import.</text>
  <text x="40" y="346" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">What it does not do</text>
  <text x="40" y="374" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#57534e">It does not shrink the trip. It does not switch the charger. It does not invent a carbon saving.</text>
</svg>
